[package]
name = "ccsp"
version = "0.1.0"
edition = "2024"
description = "Switch Claude Code between accounts"
license = "MIT"
repository = "https://github.com/niltonfrederico/ccsp"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = "1.1.8"
trash = "5.2.9"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serde_json = "1.0.154"
tempfile = "3.27.0"
